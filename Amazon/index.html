<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>replit</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>

<body>
  <header>
    <section class="amazon">
      <div class="left">
        <img class='amazon-icon' src='https://cdn.freebiesupply.com/images/large/2x/amazon-logo-transparent.png' alt='Amazon icon'/>
        <h6>Hello</h6>
        <button class='location'><img class='location-icon' src='https://png.pngtree.com/png-vector/20190508/ourmid/pngtree-vector-location-icon-png-image_1028445.jpg'/>Select your address</button>
      </div>

      <div class='search'>
        <button class='category'>All</button>
        <input class='search-bar' placeholder='Search Amazon.ca'/>
        <button class='go'><img class='search-icon' src='https://upload.wikimedia.org/wikipedia/commons/thumb/5/55/Magnifying_glass_icon.svg/768px-Magnifying_glass_icon.svg.png'/></button>
      </div>

      <div class='right'
        <button class='language'><img class='canada' src='https://cdn.freebiesupply.com/logos/large/2x/canada-flag-logo-png-transparent.png'/>EN</button>
        <p>Hello, sign in</p>
        <button class='account'>Account & Lists</button>
        <button class='returns'>Returns & Orders</button>
        <button class='cart'><img class='shopping-cart' src='https://cdn.icon-icons.com/icons2/1930/PNG/512/shoppingcartfacingleft_122199.png'/>Cart</button>
      </div>
    </section>
  </header>

  <script src="script.js"></script>

</body>

</html>
