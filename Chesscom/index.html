<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>replit</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>

<body>
  <main>
    <nav>
      <section class='nav-top'>
        <div class='nav-button'>
          <img class='chess-logo' src='https://images.chesscomfiles.com/uploads/v1/images_users/tiny_mce/PedroPinhata/phpN0kcoR.png' alt='chess.com'/>
        </div>
        <div class='nav-button'>
          <p>Play</p>
        </div>
        <div class='nav-button'>
          <p>Puzzles</p>
        </div>
        <div class='nav-button'>
          <p>Learn</p>
        </div>
        <div class='nav-button'>
          <p>Watch</p>
        </div>
        <div class='nav-button'>
          <p>News</p>
        </div>
        <div class='nav-button'>
          <p>Social</p>
        </div>
        <div class='nav-button'>
          <p>More</p>
        </div>
        <button class='signup'>Sign Up</button>
        <button class='login'>Log In</button>
      </section>

      <section class='nav-bottom'>
        <div class='nav-button2'>
          <p>English</p>
        </div>
        <div class='nav-button2'>
          <p>Help</p>
        </div>
    </nav>

    <div class='content'>
      <section class='play'>
        <div class='play-image-container'>
          <img src='https://www.chess.com/bundles/web/images/offline-play/standardboard.1d6f9426.png' class='play-image' alt='chess board'/>
        </div>
        <div class='play-container'>
          <h1>
            <span>Play Chess</span>
            <span>Online</span>
            <span>on the #1 site!</span>
          </h1>
          <div class='players'>
            <p><span>13,562,465</span> Games Today</p>
            <p><span>100,324</span> Playing Now</p>
          </div>
          <button class='play-button play-online'>
            <h2>Play Online</h2>
            <p>Play with someone at your level</p>
          </button>
          <button class='play-button play-computer'>
            <h2>Play Computer</h2>
            <p>Play vs customizable training bots</p>
          </button>
        </div>
      </section>

      
      <section class='solve-puzzles'>
        
        <div class='puzzles-container'>
          <h1>Solve Chess Puzzles</h1>
          <button class='puzzles-button'>
            <h2>Solve Puzzles</h2>
          </button>
          <div class='quote'>
            <img src='https://www.chess.com/bundles/web/images/faces/hikaru-nakamura.e1ca9267.jpg' class='gm-image' alt='Hikaru Makamura'/>
            <p>"Puzzles are the best way to improve puzzle recognition, and no site does it better."</p>
            <h5>GM</h5>
            <p>Hikaru Nakamura</p> 
          </div>
        </div>

        <div class='puzzles-image-container'>
          <img src='https://www.chess.com/bundles/web/images/web/board-puzzles.4a54c49f@2x.png' class='puzzle-image' alt='chess board'/>
        </div>

      </section>
    </div>
  </main>

  <script src="script.js"></script>

</body>

</html>
