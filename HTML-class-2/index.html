  <form>
    <h6>*Name:</h6>
    <input placeholder='Bob'/>
    <h6>*Email:</h6>
    <input type='email' placeholder='Bob123@gmail.com'/>
    <h6>Age:</h6>
    <input placeholder='100'/>
    <h6>Country:</h6>
    <input type='radio' id='United States' name='country' value='United States'/>
    <label for='United States'>United States</label>
    <br>
    <input type='radio' id='China' name='country' value='China'/>
    <label for='China'>China</label>
    <br>
    <input type = 'radio' id='Canada' name='country' value='Canada'/>
    <label for='Canada'>Canada</label>
    <br>
    <br>
    <br>
    <h6>*How early do you wake up every day? (select one)</h6>
    <input type='radio' id='6am' name='time' value='6am or earlier'/>
    <label for='6am'>6am or earlier</label>
    <br>
    <input type='radio' id='7am' name='time' value='7am'/>
    <label for='7am'>7am</label>
    <br>
    <input type='radio' id='8am' name='time' value='8am'/>
    <label for='8am'>8am</label>
    <br>
    <input type='radio' id='9am' name='time' value='9am or later'/>
    <label for='9am'>9am or later</label>

     <h6>*On a scale of 1-5, how tired do you feel when waking up in the morning? (select one)</h6>

    <label for='1'>1</label>
    <br>
    <input type='radio' id='2' name='tired' value='2'/>
